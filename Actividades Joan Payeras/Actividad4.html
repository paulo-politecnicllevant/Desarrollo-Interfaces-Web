<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <title>Activitat 4 · Formulari</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
  <form class="max-w-md mx-auto mt-12 p-8 border border-slate-200 rounded-2xl">
    <h1>Inscripció al taller de Tailwind</h1>
    <p>Omple les dades i et confirmarem la plaça per correu.</p>

    <div class="mt-5">
      <label for="nom" class="block mb-1.5">Nom complet</label>
      <input
        id="nom"
        type="text"
        placeholder="Marta Pons"
        class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
      />
    </div>

    <div class="mt-5">
      <label for="correu" class="block mb-1.5">Correu electrònic</label>
      <input
        id="correu"
        type="email"
        placeholder="marta@exemple.cat"
        class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
      />
    </div>

    <div class="mt-5">
      <label for="cp" class="block mb-1.5">Codi postal</label>
      <input
        id="cp"
        type="text"
        placeholder="07001"
        class="max-w-32 px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
      />
    </div>

    <div class="mt-5">
      <label for="comentaris" class="block mb-1.5">Comentaris</label>
      <textarea
        id="comentaris"
        class="w-full min-h-32 px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
      ></textarea>
    </div>

    <div class="mt-8">
      <button type="submit" class="w-fit rounded-lg border-2 border-indigo-600">Envia</button>

      <button type="reset" class="ml-3 border border-dashed">Esborra</button>
    </div>
  </form>
</body>
</html>
