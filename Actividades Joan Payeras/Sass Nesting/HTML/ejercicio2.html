
<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercici 2: Targeta de perfil</title>
  <link rel="stylesheet" href="main.css">
</head>
<body>
  <main class="contenidor">
    <article class="perfil">
      <img src="https://i.pravatar.cc/150?u=a" alt="Foto de perfil" class="perfil__avatar">
      <h2 class="perfil__nom">Maria Garcia</h2>
      <p class="perfil__carrec">Dissenyadora UX/UI</p>
      <p class="perfil__bio">Apasionada per la creació d'interfícies intuitives i accessibles.</p>
      <button class="perfil__boto">Seguir</button>
    </article>


    <article class="perfil perfil--administrador">
      <img src="https://i.pravatar.cc/150?u=b" alt="Foto de perfil" class="perfil__avatar">
      <h2 class="perfil__nom">Joan Puig</h2>
      <p class="perfil__carrec">Administrador del sistema</p>
      <p class="perfil__bio">Gestionant la infraestructura des de fa 10 anys.</p>
      <button class="perfil__boto">Missatge privat</button>
    </article>
  </main>
</body>
</html>
